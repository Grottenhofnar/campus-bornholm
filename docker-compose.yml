services:
  db:
    image: postgres:16
    container_name: campus_bornholm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_bornholm
    ports:
      - "5432:5432"
    volumes:
      - campus_bornholm_data:/var/lib/postgresql/data

volumes:
  campus_bornholm_data:
