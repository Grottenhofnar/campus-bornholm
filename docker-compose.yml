services:
  db:
    image: postgres:16.2
    container_name: campus_bornholm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_bornholm
      TZ: Europe/Copenhagen
    ports:
      - "5432:5432"
    volumes:
      - campus_bornholm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus_bornholm_data:
